[project]
name = "sg_utils"
version = "1.0.0"
description = "Segger analysis"
authors = [
    {name = "Andrew Moorman", email = "moormana@mskcc.org"}
]
license = {text = "MIT License"}
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "adjusttext>=1.3.0",
    "celltypist>=1.6.3",
    "geopandas>=1.0.1",
    "gseapy>=1.1.8",
    "hotspotsc>=1.1.3",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.1",
    "numpy>=2.2.5",
    "pandas>=2.2.3",
    "pydeseq2>=0.5.0",
    "rtree>=1.4.0",
    "scanpy>=1.11.1",
    "scipy>=1.15.2",
    "seaborn>=0.13.2",
    "shapely>=2.1.0",
    "tifffile>=2025.3.30",
    "zarr<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

