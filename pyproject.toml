[project]
name = "sg_utils"
version = "1.0.0"
description = "Segger analysis"
authors = [
    {name = "Andrew Moorman", email = "moormana@mskcc.org"}
]
license = {text = "MIT License"}
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "adjusttext>=1.3.0",
    "celltypist>=1.6.3",
    "geopandas>=1.0.1",
    "gseapy>=1.1.8",
    "hotspotsc>=1.1.3",
    "imagecodecs>=2024.9.22",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.1",
    "numpy>=1.26.4",
    "pandas>=2.2",
    "polars>=1.20",
    "pyarrow>=17",
    "pydeseq2>=0.5.0",
    "rtree>=1.4.0",
    "scanpy>=1.11.4",
    "scikit-image>=0.24",
    "scipy>=1.15.2",
    "seaborn>=0.13.2",
    "shapely>=2.1.0",
    "spatialdata>=0.4.0,<0.5",
    "tifffile>=2025.3.30",
    "zarr<3",
]

[project.optional-dependencies]
# CUDA 12 stack of the Fig. 5, Extended Data Fig. 1, 2, 6 and Supplementary Fig. 1, 2, 11 notebooks
gpu = [
    "cellpose>=4",
    "cudf-cu12==24.10.*; sys_platform == 'linux'",
    "cugraph-cu12==24.10.*; sys_platform == 'linux'",
    "cuml-cu12==24.10.*; sys_platform == 'linux'",
    "cupy-cuda12x>=12.2,<13; sys_platform == 'linux'",
    "lightning>=2.4",
    "segger @ git+https://github.com/dpeerlab/segger@98765aaacc3e62eba8a3a9f80fc35222d1a831ba",
    "torch==2.5.*",
    "torch-geometric>=2.6",
    "umap-learn>=0.5.7",
]
# Resolved separately from `gpu`, so the CPU environment keeps its own versions
cpu = []

[tool.uv]
index-strategy = "unsafe-best-match"
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

